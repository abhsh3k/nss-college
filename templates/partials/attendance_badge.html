<div class="inline-flex rounded-lg border border-gray-200 shadow-sm" role="group">
  <button type="button" 
          hx-post="/dashboard/teacher/session/{{ session_id }}/toggle" 
          hx-vals='{"student_id": {{ student_id }}, "status": "present", "csrf_token": "{{ csrf_token }}"}' 
          hx-target="#status-badge-{{ student_id }}" 
          class="px-3 py-1.5 text-xs font-semibold rounded-l-lg transition-colors {% if status == "present" %}bg-emerald-600 text-white border-emerald-600{% else %}bg-white text-gray-700 hover:bg-gray-100{% endif %}">
    Present
  </button>
  <button type="button" 
          hx-post="/dashboard/teacher/session/{{ session_id }}/toggle" 
          hx-vals='{"student_id": {{ student_id }}, "status": "absent", "csrf_token": "{{ csrf_token }}"}' 
          hx-target="#status-badge-{{ student_id }}" 
          class="px-3 py-1.5 text-xs font-semibold border-x border-gray-200 transition-colors {% if status == "absent" %}bg-rose-600 text-white border-rose-600{% else %}bg-white text-gray-700 hover:bg-gray-100{% endif %}">
    Absent
  </button>
  <button type="button" 
          hx-post="/dashboard/teacher/session/{{ session_id }}/toggle" 
          hx-vals='{"student_id": {{ student_id }}, "status": "leave", "csrf_token": "{{ csrf_token }}"}' 
          hx-target="#status-badge-{{ student_id }}" 
          class="px-3 py-1.5 text-xs font-semibold rounded-r-lg transition-colors {% if status == "leave" %}bg-amber-500 text-white border-amber-500{% else %}bg-white text-gray-700 hover:bg-gray-100{% endif %}">
    Leave
  </button>
</div>
