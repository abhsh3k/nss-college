<div id="attendance-sheet-container" class="bg-white rounded-lg border border-gray-200 p-6 shadow-sm mt-8 animate-in fade-in slide-in-from-bottom-4 duration-300">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h3 class="text-xl font-bold text-gray-900">Mark Attendance</h3>
      <p class="text-sm text-gray-500">Session Date: {{ on_date_str }}</p>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="border-b bg-gray-50 text-xs font-semibold text-gray-600 uppercase tracking-wider">
          <th class="py-3 px-4 w-32">Roll No</th>
          <th class="py-3 px-4">Student Name</th>
          <th class="py-3 px-4 text-center w-64">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100 text-sm">
        {% for student in students %}
        <tr class="hover:bg-gray-50 transition">
          <td class="py-3 px-4 font-mono font-medium text-gray-700">{{ student.roll_number }}</td>
          <td class="py-3 px-4 font-semibold text-gray-900">{{ student.full_name }}</td>
          <td class="py-3 px-4 text-center" id="status-badge-{{ student.student_id }}">
            <div class="inline-flex rounded-lg border border-gray-200 shadow-sm" role="group">
              <button type="button" hx-post="/dashboard/teacher/session/{{ session_id }}/toggle" hx-vals='{"student_id": {{ student.student_id }}, "status": "present", "csrf_token": "{{ csrf_token }}"}' hx-target="#status-badge-{{ student.student_id }}" class="px-3 py-1.5 text-xs font-semibold rounded-l-lg transition-colors {% if student.status == "present" %}bg-emerald-600 text-white border-emerald-600{% else %}bg-white text-gray-700 hover:bg-gray-100{% endif %}">
                Present
              </button>
              <button type="button" hx-post="/dashboard/teacher/session/{{ session_id }}/toggle" hx-vals='{"student_id": {{ student.student_id }}, "status": "absent", "csrf_token": "{{ csrf_token }}"}' hx-target="#status-badge-{{ student.student_id }}" class="px-3 py-1.5 text-xs font-semibold border-x border-gray-200 transition-colors {% if student.status == "absent" %}bg-rose-600 text-white border-rose-600{% else %}bg-white text-gray-700 hover:bg-gray-100{% endif %}">
                Absent
              </button>
              <button type="button" hx-post="/dashboard/teacher/session/{{ session_id }}/toggle" hx-vals='{"student_id": {{ student.student_id }}, "status": "leave", "csrf_token": "{{ csrf_token }}"}' hx-target="#status-badge-{{ student.student_id }}" class="px-3 py-1.5 text-xs font-semibold rounded-r-lg transition-colors {% if student.status == "leave" %}bg-amber-500 text-white border-amber-500{% else %}bg-white text-gray-700 hover:bg-gray-100{% endif %}">
                Leave
              </button>
            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
