{# One card per management area. Expects `areas` (a list of `sections::Area`)
   in the including template's scope. Three across on a laptop, two on a
   tablet, one on a phone — nothing scrolls sideways. #}
<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  {% for a in areas %}
  <a href="/admin/manage/{{ a.key }}" class="group flex flex-col rounded border border-ink/15 bg-mist/40 p-5 hover:border-ink/40 hover:bg-mist focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent">
    <span class="font-display text-lg font-semibold md:text-xl">{{ a.title }}</span>
    <span class="mt-1 text-sm leading-relaxed text-ink/70">{{ a.desc }}</span>
    <span class="mt-4 text-sm font-semibold text-brand">Open <span aria-hidden="true" class="inline-block transition-transform group-hover:translate-x-0.5">&rarr;</span></span>
  </a>
  {% endfor %}
</div>
