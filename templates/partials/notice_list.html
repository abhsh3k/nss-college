{% if notices.is_empty() %}
<p class="py-3 text-ink/70">No notices right now. New notices appear here as soon as they are published.</p>
{% else %}
<ul class="divide-y divide-ink/10">
  {% for n in notices %}
  <li>
    <a href="{{ n.href }}" class="group block py-3">
      <span class="text-sm text-brand">{{ n.category }}</span>
      {% if n.is_new %}<span class="ml-2 rounded bg-accent px-1.5 py-0.5 text-xs font-semibold text-ink">New</span>{% endif %}
      <span class="mt-1 block font-medium group-hover:underline">{{ n.title }}</span>
    </a>
  </li>
  {% endfor %}
</ul>
{% endif %}
