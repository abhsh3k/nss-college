# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nss
      POSTGRES_PASSWORD: nss
      POSTGRES_DB: nss_college
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nss -d nss_college"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
