[package]
name = "nss-college"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
askama = "0.12"
askama_axum = "0.4"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
tower-http = { version = "0.5", features = ["fs", "trace", "compression-gzip", "set-header"] }
tower-sessions = "0.12"
tower-sessions-sqlx-store = { version = "0.12", features = ["postgres"] }
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
rpassword = "7"
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

# Argon2 is very slow unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

# Argon2 is deliberately slow; unoptimised debug builds make it painfully slow (bulk imports).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
